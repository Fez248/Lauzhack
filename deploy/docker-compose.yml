# Server + Postgres (plan §15). From the repo root, with a filled-in ../.env (copy deploy/.env.example):
#   docker compose -f deploy/docker-compose.yml up --build
# Then expose it: cloudflared tunnel --url http://localhost:8080
services:
  db:
    image: postgres:16
    env_file: ../.env            # provides POSTGRES_PASSWORD
    environment:
      POSTGRES_DB: tea
      POSTGRES_USER: tea
    volumes: [ "tea-db:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U tea -d tea"], interval: 5s, retries: 10 }
    restart: unless-stopped
  app:
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: ../.env
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/tea
      DATABASE_USER: tea
      CONTENT_DIR: /app/content
    ports: [ "8080:8080" ]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
volumes: { tea-db: {} }
