# Screenshot doc: renders every pane of the app off-screen (jvm tests, no browser or display) and
# builds a browsable doc (README.md + img/) with scripts/screenshot_doc.py.
#
# - Every run uploads the doc as the `screenshots` artifact (download it from the run page).
# - On main (push or manual run), the doc is also committed to the `screenshots` branch, so it can
#   be browsed on GitHub at /tree/screenshots. The bot never commits to main.
name: Screenshots

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'shared/**'
      - 'content/**'
      - 'scripts/screenshot_doc.py'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push to the `screenshots` branch (main runs only)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # Same as CI: keep Android off even though runners set ANDROID_HOME.
      - name: Render screenshots
        run: >-
          ./gradlew -Ptea.android=false :shared:jvmTest
          --tests 'tea.ui.*' --tests 'tea.learn.LearnScreenshotsTest'
          --console=plain

      - name: Build the doc
        if: ${{ !cancelled() }}
        run: python3 scripts/screenshot_doc.py shared/build/screenshots build/screenshot-doc --sha "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Upload the doc
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshot-doc/
          if-no-files-found: error

      - name: Publish to the screenshots branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin screenshots; then
            git worktree add -B screenshots ../publish FETCH_HEAD
          else
            git worktree add --orphan -b screenshots ../publish
          fi
          find ../publish -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r build/screenshot-doc/. ../publish/
          cd ../publish
          git add -A
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
          else
            git commit -q -m "Screenshots for ${GITHUB_SHA::7}"
            git push origin screenshots
          fi
          echo "Doc: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/screenshots" >> "$GITHUB_STEP_SUMMARY"
